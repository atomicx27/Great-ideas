<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Climber Pilot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agentic Climber Pilot</h1>
        <p>Autonomous LLM-driven Space Elevator Ascent Agent</p>
    </header>

    <main class="container">
        <section class="control-panel">
            <h2>Climber Navigation Console</h2>
            <button id="pilot-btn" class="primary-btn">Engage Autonomous Ascent</button>
            <button id="clear-btn" class="secondary-btn">Clear Log</button>
        </section>

        <section class="agent-panel">
            <h2>Agent Reasoning Log</h2>
            <div id="agent-log" class="terminal"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
