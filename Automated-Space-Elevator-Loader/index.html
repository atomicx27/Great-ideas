<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Space Elevator Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Automated Space Elevator Loader</h1>
        <div class="status-panel" id="status-panel">Ready for Loading</div>
        <div class="controls">
            <label for="cargo-weight">Cargo Weight (kg):</label>
            <input type="number" id="cargo-weight" value="5000">
        </div>
        <button id="load-btn">Load Cargo</button>
        <div class="log" id="log"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
