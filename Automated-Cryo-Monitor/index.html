<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Cryo Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Automated Cryo Monitor</h1>
        <p>Deterministic Vital Sign Monitoring in Cryosleep</p>
    </header>

    <main class="container">
        <section class="control-panel">
            <h2>Pod Controls</h2>
            <button id="scan-btn" class="primary-btn">Initialize Vitals Scan</button>
            <p id="status-text" class="status-indicator">Status: Monitoring</p>
        </section>

        <section id="results-panel" class="hidden">
            <h2>Scan Results</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Pods Scanned</h3>
                    <p id="total-pods">0</p>
                </div>
                <div class="stat-card">
                    <h3>Wake Protocols Initiated</h3>
                    <p id="critical-alerts">0</p>
                </div>
            </div>

            <div class="log-container">
                <h3>Vitals Log</h3>
                <table id="vitals-log">
                    <thead>
                        <tr>
                            <th>Pod ID</th>
                            <th>Heart Rate (bpm)</th>
                            <th>Temp (K)</th>
                            <th>Condition</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
