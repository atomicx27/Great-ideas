<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Wormhole Network Orchestrator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AGI Wormhole Network Orchestrator</h1>
        <p>A swarm of specialized sub-agents coordinating a galactic transport network, handling mapping, stabilization, and fleet routing.</p>

        <div class="control-panel">
            <button id="orchestrate-btn">Establish Network Route</button>
        </div>

        <div class="status-panel">
            <h2>Network Orchestrator Protocol</h2>
            <div id="logs" class="logs-container">Awaiting routing request...</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
