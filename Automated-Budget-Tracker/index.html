<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Automated Budget Tracker</h1>
            <p>Deterministic Rule-Based Budget Categorization</p>
        </header>
        <main>
            <section class="tracker-form">
                <form id="expense-form">
                    <div class="form-group">
                        <label for="amount">Amount ($):</label>
                        <input type="number" id="amount" required step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="type">Expense Type:</label>
                        <select id="type" required>
                            <option value="groceries">Groceries</option>
                            <option value="rent">Rent</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="utilities">Utilities</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <button type="submit">Track Expense</button>
                </form>
            </section>
            <section class="results">
                <h2>Categorization Result</h2>
                <div id="result-output"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
