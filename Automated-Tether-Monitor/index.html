<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Tether Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Automated Tether Monitor</h1>
        <p>Deterministic Space Elevator Strain Assessment</p>
    </header>

    <main class="container">
        <section class="control-panel">
            <h2>Sensor Controls</h2>
            <button id="scan-btn" class="primary-btn">Initialize Tether Scan</button>
            <p id="status-text" class="status-indicator">Status: Idle</p>
        </section>

        <section id="results-panel" class="hidden">
            <h2>Scan Results</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Segments Scanned</h3>
                    <p id="total-segments">0</p>
                </div>
                <div class="stat-card">
                    <h3>Critical Alerts</h3>
                    <p id="critical-alerts">0</p>
                </div>
            </div>

            <div class="log-container">
                <h3>Strain Log</h3>
                <table id="strain-log">
                    <thead>
                        <tr>
                            <th>Segment ID</th>
                            <th>Strain (%)</th>
                            <th>Condition</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
