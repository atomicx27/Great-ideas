<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Content Moderator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../shared/llm-api.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agentic Content Moderator</h1>
            <p>Single-agent LLM-based content analysis with context understanding</p>
        </header>

        <main>
            <section class="card">
                <h2>Analyze Content</h2>
                <div class="input-group">
                    <label>OpenAI API Key:</label>
                    <input type="password" id="api-key" placeholder="sk-..." />

                    <label>Content to analyze:</label>
                    <textarea id="content-input" placeholder="Paste the content here..."></textarea>

                    <button id="process-btn">Analyze with LLM</button>
                </div>
            </section>

            <section id="results-section" class="card hidden">
                <h2>LLM Analysis</h2>
                <div id="result-output"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
