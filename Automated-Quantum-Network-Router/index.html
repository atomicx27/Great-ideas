<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Quantum Network Router</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Automated Quantum Network Router</h1>
        <p>Deterministically routes quantum packets.</p>

        <form id="routing-form">
            <label for="bandwidth">Bandwidth Requirement (Qbits/s):</label>
            <input type="number" id="bandwidth" required min="1">

            <label for="priority">Priority Level (1-10):</label>
            <input type="number" id="priority" required min="1" max="10">

            <button type="submit">Route Packet</button>
        </form>

        <div id="output" class="output"></div>
    </div>

    <!-- Shared Toast Container -->
    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
