<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Wealth Advisor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Agentic Wealth Advisor</h1>
            <p>Autonomous AI Agent for Wealth Management</p>
        </header>
        <main>
            <section class="config-section">
                <div class="form-group">
                    <label for="provider">LLM Provider:</label>
                    <select id="provider">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="ollama">Ollama (Local)</option>
                    </select>
                </div>
            </section>
            <section class="advisor-form">
                <form id="profile-form">
                    <div class="form-group">
                        <label for="income">Annual Income ($):</label>
                        <input type="number" id="income" required step="1000">
                    </div>
                    <div class="form-group">
                        <label for="goal">Financial Goal:</label>
                        <input type="text" id="goal" required>
                    </div>
                    <div class="form-group">
                        <label for="risk">Risk Tolerance:</label>
                        <select id="risk" required>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <button type="submit" id="generate-btn">Generate Advice</button>
                </form>
            </section>
            <section class="results">
                <h2>Advisor Output</h2>
                <div id="loading" class="loader" style="display: none;"></div>
                <div id="advice-output"></div>
            </section>
        </main>
    </div>
    <script src="../shared/llm-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
