<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Hyperloop Router</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agentic Hyperloop Router</h1>
        <div class="controls">
            <label for="provider">Provider:</label>
            <select id="provider">
                <option value="ollama">Ollama</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
            </select>
            <label for="destination">Destination:</label>
            <input type="text" id="destination" value="New York to Boston">
        </div>
        <button id="route-btn">Route Pod</button>
        <div class="agent-output" id="agent-output">Awaiting instruction...</div>
        <div class="log" id="log"></div>
    </div>
    <script src="../shared/llm-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
