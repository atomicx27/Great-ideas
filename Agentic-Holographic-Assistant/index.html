<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Holographic Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../new_modern_ux.css">
</head>
<body>
    <header>
        <h1>Agentic Holographic Assistant</h1>
        <p>Autonomous Gaze-Responsive 3D Interface</p>
    </header>

    <main class="container">
        <section class="control-panel">
            <h2>User Tracking Simulation</h2>
            <div class="input-group">
                <label for="gaze-focus">Simulated User Gaze Focus:</label>
                <select id="gaze-focus">
                    <option value="engine-schematic">Engine Schematic</option>
                    <option value="medical-scan">Medical MRI Scan</option>
                    <option value="architecture-blueprint">Architecture Blueprint</option>
                </select>
            </div>
            <div class="input-group">
                <label for="provider">LLM Provider:</label>
                <select id="provider">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="ollama">Ollama (Local)</option>
                </select>
            </div>
            <button id="adapt-btn" class="primary-btn">Process Gaze & Adapt UI</button>
            <p id="status-text" class="status-indicator">Status: Waiting for Gaze Input</p>
        </section>

        <section id="results-panel" class="hidden">
            <h2>Holographic UI Adaptation</h2>
            <div class="stats-grid">
                <div class="stat-card" style="grid-column: span 2;">
                    <h3>Agent Action Log</h3>
                    <div id="log-container" class="log-container"></div>
                </div>
                <div class="stat-card">
                    <h3>Context Menu Pulled</h3>
                    <p id="menu-output">N/A</p>
                </div>
                <div class="stat-card">
                    <h3>Hologram Adjustment</h3>
                    <p id="hologram-output">N/A</p>
                </div>
            </div>
        </section>
    </main>

    <script src="../shared/llm-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
