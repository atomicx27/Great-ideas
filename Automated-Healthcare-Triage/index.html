<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Healthcare Triage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Automated Healthcare Triage</h1>
            <p>Rule-based symptom assessment and routing</p>
        </header>

        <main>
            <section class="card">
                <h2>Enter Symptoms</h2>
                <div class="input-group">
                    <label>List patient symptoms (comma separated):</label>
                    <textarea id="symptoms-input" placeholder="e.g. chest pain, shortness of breath, headache..."></textarea>
                    <button id="process-btn">Assess Priority</button>
                </div>
            </section>

            <section id="results-section" class="card hidden">
                <h2>Triage Result</h2>
                <div id="result-output"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
