<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Wormhole Stabilizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agentic Wormhole Stabilizer</h1>
        <p>An autonomous agent that manages exotic matter injection to dynamically stabilize collapsing wormhole throats based on quantum fluctuation data.</p>

        <div class="control-panel">
            <div class="input-group">
                <label for="fluctuations">Quantum Fluctuations (Hz):</label>
                <input type="number" id="fluctuations" value="5000">
            </div>
            <button id="stabilize-btn">Analyze & Stabilize</button>
        </div>

        <div class="status-panel">
            <h2>Stabilization Actions</h2>
            <div id="logs" class="logs-container">Awaiting telemetry...</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
