<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Mars Habitat Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Automated Mars Habitat Builder</h1>
        <p>Allocates materials based on habitat volume and crew size.</p>

        <form id="build-form">
            <label for="volume">Habitat Volume (Cubic Meters):</label>
            <input type="number" id="volume" required min="10">

            <label for="crew">Crew Size:</label>
            <input type="number" id="crew" required min="1" max="50">

            <button type="submit">Allocate Materials</button>
        </form>

        <div id="output" class="output"></div>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
