<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Subspace Relay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../new_modern_ux.css">
</head>
<body>
    <header>
        <h1>Automated Subspace Relay</h1>
        <p>Deterministic Signal Routing Protocol</p>
    </header>

    <main class="container">
        <section class="control-panel card">
            <h2>Relay Controls</h2>
            <button id="relay-btn" class="primary-btn">Initialize Signal Relay</button>
            <p id="status-text" class="status-indicator">Status: Waiting</p>
        </section>

        <section class="results-panel card">
            <h2>Signal Packets</h2>
            <ul id="packet-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
