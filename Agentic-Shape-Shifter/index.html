<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Shape Shifter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../new_modern_ux.css">
</head>
<body>
    <header>
        <h1>Agentic Shape Shifter</h1>
        <p>Autonomous Aerodynamic Optimization via ReAct Loop</p>
    </header>

    <main class="container">
        <section class="control-panel">
            <h2>Wind Tunnel Settings</h2>
            <div class="input-group">
                <label for="current-shape">Current Shape:</label>
                <select id="current-shape">
                    <option value="blunt-cylinder">Blunt Cylinder</option>
                    <option value="teardrop">Teardrop</option>
                    <option value="airfoil">Airfoil</option>
                </select>
            </div>
            <div class="input-group">
                <label for="wind-speed">Wind Speed (Mach):</label>
                <input type="number" id="wind-speed" value="0.8" step="0.1" min="0.1" max="5.0">
            </div>
            <div class="input-group">
                <label for="provider">LLM Provider:</label>
                <select id="provider">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="ollama">Ollama (Local)</option>
                </select>
            </div>
            <button id="optimize-btn" class="primary-btn">Initialize Optimization Loop</button>
            <p id="status-text" class="status-indicator">Status: Awaiting Initialization</p>
        </section>

        <section id="results-panel" class="hidden">
            <h2>Agent Thought Process</h2>
            <div id="log-container" class="log-container">
                <!-- Logs will be injected here -->
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Final Optimal Shape</h3>
                    <p id="final-shape-output">N/A</p>
                </div>
            </div>
        </section>
    </main>

    <script src="../shared/llm-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
