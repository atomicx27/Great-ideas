<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Dark Matter Orchestrator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AGI Dark Matter Orchestrator</h1>
        <p>A multi-agent AGI system that delegates dark matter harvesting. It coordinates scanner swarms, trap placement, and energy extraction.</p>

        <div class="control-panel">
            <button id="orchestrate-btn">Orchestrate Harvesting Mission</button>
        </div>

        <div class="status-panel">
            <h2>Orchestrator Logs</h2>
            <div id="logs" class="logs-container">Awaiting mission parameters...</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
