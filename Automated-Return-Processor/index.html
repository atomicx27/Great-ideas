<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Return Processor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fa-solid fa-box-open"></i> E-Commerce Returns <span class="badge">Automated</span></h1>
        </header>

        <main class="main-content">
            <div class="panel form-panel">
                <h2>Scan Return Item</h2>
                <form id="return-form">
                    <div class="form-group">
                        <label>Order ID / Receipt #</label>
                        <input type="text" id="order-id" placeholder="e.g. ORD-12345" required value="ORD-99887">
                    </div>
                    <div class="form-group">
                        <label>Item Category</label>
                        <select id="item-category">
                            <option value="electronics">Electronics</option>
                            <option value="clothing">Clothing</option>
                            <option value="software">Software/Digital</option>
                            <option value="perishable">Perishable Goods</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Purchase Price ($)</label>
                        <input type="number" id="item-price" value="99.99" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Days Since Purchase</label>
                        <input type="number" id="days-since" value="14" required>
                    </div>
                    <div class="form-group">
                        <label>Condition</label>
                        <select id="item-condition">
                            <option value="unopened">Unopened / New</option>
                            <option value="opened_good">Opened / Like New</option>
                            <option value="damaged">Damaged by Customer</option>
                            <option value="defective">Defective from Manufacturer</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-barcode"></i> Process Return</button>
                </form>
            </div>

            <div class="panel result-panel">
                <h2>Processing Decision</h2>
                <div id="result-display" class="hidden">
                    <div class="status-indicator" id="status-icon"></div>
                    <h3 id="decision-text"></h3>
                    <div class="refund-amount">Refund: <span id="refund-value">$0.00</span></div>
                    <ul class="reason-list" id="reason-list"></ul>
                </div>
                <div id="empty-state" class="empty-state">
                    <i class="fa-solid fa-clipboard-list text-muted"></i>
                    <p class="text-muted">Enter item details to process.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
